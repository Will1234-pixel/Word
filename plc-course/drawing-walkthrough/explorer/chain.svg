<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" style="font-family:IBM Plex Sans,Segoe UI,Roboto,sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="1400" height="780" fill="white"/>
<text x="20" y="40" font-size="26" font-weight="600" fill="#1b1f23">One signal, two views: nitric acid low flow 03FZT03002</text>
<text x="20" y="80" font-size="16" fill="#0b6e8f" font-weight="600">WIRING VIEW, loop drawing 075 with the power path from sheets 043 and 035</text>
<text x="90" y="455" font-size="16" fill="#b8322a" font-weight="600">LOGIC VIEW, FLD 051</text>
<g class="blk" data-go="x075_tx" style="cursor:pointer"><rect x="20" y="100" width="215" height="96" rx="8" fill="#e3f0f5" stroke="#0b6e8f" stroke-width="2"/>
<text x="32" y="126" font-size="16" font-weight="600" fill="#1b1f23">Transmitter 03FZT03002</text>
<text x="32" y="148" font-size="13.5" fill="#1b1f23">69% nitric acid, low flow</text>
<text x="32" y="167" font-size="13.5" fill="#1b1f23">4-20 mA on two wires</text>
<text x="225" y="188" font-size="11.5" text-anchor="end" fill="#0b6e8f" font-weight="600">loop 075</text></g>
<g class="blk" data-go="x075_terms" style="cursor:pointer"><rect x="255" y="100" width="215" height="96" rx="8" fill="#e3f0f5" stroke="#0b6e8f" stroke-width="2"/>
<text x="267" y="126" font-size="16" font-weight="600" fill="#1b1f23">Cable 3/C650</text>
<text x="267" y="148" font-size="13.5" fill="#1b1f23">core 1 = +, core 2 = -</text>
<text x="267" y="167" font-size="13.5" fill="#1b1f23">rail 3/C650, terminals 1 and 2</text>
<text x="460" y="188" font-size="11.5" text-anchor="end" fill="#0b6e8f" font-weight="600">loop 075</text></g>
<g class="blk" data-go="x075_wire" style="cursor:pointer"><rect x="490" y="100" width="180" height="96" rx="8" fill="#e3f0f5" stroke="#0b6e8f" stroke-width="2"/>
<text x="502" y="126" font-size="16" font-weight="600" fill="#1b1f23">Wire 1101/1</text>
<text x="502" y="148" font-size="13.5" fill="#1b1f23">screened single core</text>
<text x="502" y="167" font-size="13.5" fill="#1b1f23">number = card / channel</text>
<text x="660" y="188" font-size="11.5" text-anchor="end" fill="#0b6e8f" font-weight="600">loop 075</text></g>
<g class="blk" data-go="x075_pins" style="cursor:pointer"><rect x="690" y="100" width="230" height="96" rx="8" fill="#e3f0f5" stroke="#0b6e8f" stroke-width="2"/>
<text x="702" y="126" font-size="16" font-weight="600" fill="#1b1f23">Card F6217, position 1101</text>
<text x="702" y="148" font-size="13.5" fill="#1b1f23">plug Z7127, channel 1</text>
<text x="702" y="167" font-size="13.5" fill="#1b1f23">pins z4 (+) and d4 (-)</text>
<text x="910" y="188" font-size="11.5" text-anchor="end" fill="#0b6e8f" font-weight="600">loop 075</text></g>
<g class="blk" data-go="x075_supply" style="cursor:pointer"><rect x="690" y="230" width="230" height="86" rx="8" fill="#eceeed" stroke="#5a6470" stroke-width="2"/>
<text x="702" y="256" font-size="16" font-weight="600" fill="#1b1f23">24 V to the card</text>
<text x="702" y="278" font-size="13.5" fill="#1b1f23">1L+1 on pin d30, 1L-1 on pin d26</text>
<text x="702" y="297" font-size="13.5" fill="#1b1f23">powers the transmitter</text>
<text x="910" y="308" font-size="11.5" text-anchor="end" fill="#5a6470" font-weight="600">loop 075</text></g>
<g class="blk" data-go="fuse1118" style="cursor:pointer"><rect x="440" y="230" width="220" height="86" rx="8" fill="#eceeed" stroke="#5a6470" stroke-width="2"/>
<text x="452" y="256" font-size="16" font-weight="600" fill="#1b1f23">Distribution card 1118</text>
<text x="452" y="278" font-size="13.5" fill="#1b1f23">fuse F1, 4 A, LED L1</text>
<text x="452" y="297" font-size="13.5" fill="#1b1f23">one fuse per input card</text>
<text x="650" y="308" font-size="11.5" text-anchor="end" fill="#5a6470" font-weight="600">sheet 043</text></g>
<g class="blk" data-go="fuseA" style="cursor:pointer"><rect x="215" y="230" width="205" height="86" rx="8" fill="#eceeed" stroke="#5a6470" stroke-width="2"/>
<text x="227" y="256" font-size="16" font-weight="600" fill="#1b1f23">24 V distribution</text>
<text x="227" y="278" font-size="13.5" fill="#1b1f23">red spot fuse FUSE-1</text>
<text x="227" y="297" font-size="13.5" fill="#1b1f23">L- safeclip link</text>
<text x="410" y="308" font-size="11.5" text-anchor="end" fill="#5a6470" font-weight="600">sheet 035</text></g>
<g class="blk" data-go="psu" style="cursor:pointer"><rect x="20" y="230" width="175" height="86" rx="8" fill="#eceeed" stroke="#5a6470" stroke-width="2"/>
<text x="32" y="256" font-size="16" font-weight="600" fill="#1b1f23">PSU A and PSU B</text>
<text x="32" y="278" font-size="13.5" fill="#1b1f23">230 V in, 24 V out</text>
<text x="32" y="297" font-size="13.5" fill="#1b1f23">redundancy module</text>
<text x="185" y="308" font-size="11.5" text-anchor="end" fill="#5a6470" font-weight="600">sheet 035</text></g>
<g class="blk" data-go="sig_FZA03002" style="cursor:pointer"><rect x="20" y="470" width="210" height="96" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="32" y="496" font-size="16" font-weight="600" fill="#1b1f23">Signal 03FZA03002</text>
<text x="32" y="518" font-size="13.5" fill="#1b1f23">software name of the channel</text>
<text x="32" y="537" font-size="13.5" fill="#1b1f23">true when flow is low</text>
<text x="220" y="558" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="lamp_W01" style="cursor:pointer"><rect x="20" y="610" width="210" height="70" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="32" y="636" font-size="16" font-weight="600" fill="#1b1f23">Window W01</text>
<text x="32" y="658" font-size="13.5" fill="#1b1f23">annunciator lamp, control room</text>
<text x="220" y="672" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="AND2" style="cursor:pointer"><rect x="270" y="470" width="200" height="96" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="282" y="496" font-size="16" font-weight="600" fill="#1b1f23">AND, 9 inputs</text>
<text x="282" y="518" font-size="13.5" fill="#1b1f23">every low flow, density</text>
<text x="282" y="537" font-size="13.5" fill="#1b1f23">and level signal must be true</text>
<text x="460" y="558" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="OR2" style="cursor:pointer"><rect x="510" y="470" width="160" height="96" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="522" y="496" font-size="16" font-weight="600" fill="#1b1f23">OR</text>
<text x="522" y="518" font-size="13.5" fill="#1b1f23">either this AND</text>
<text x="522" y="537" font-size="13.5" fill="#1b1f23">or the 2-input AND</text>
<text x="660" y="558" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="AND3" style="cursor:pointer"><rect x="710" y="470" width="200" height="96" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="722" y="496" font-size="16" font-weight="600" fill="#1b1f23">AND, 8 inputs</text>
<text x="722" y="518" font-size="13.5" fill="#1b1f23">collects the whole sheet</text>
<text x="900" y="558" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="ref_3B" style="cursor:pointer"><rect x="950" y="470" width="210" height="96" rx="8" fill="#f7e6e4" stroke="#b8322a" stroke-width="2"/>
<text x="962" y="496" font-size="16" font-weight="600" fill="#1b1f23">Box 3B to sheet 052</text>
<text x="962" y="518" font-size="13.5" fill="#1b1f23">continues at grid 170</text>
<text x="962" y="537" font-size="13.5" fill="#1b1f23">the trip action is there</text>
<text x="1150" y="558" font-size="11.5" text-anchor="end" fill="#b8322a" font-weight="600">FLD 051</text></g>
<g class="blk" data-go="DV3_4" style="cursor:pointer"><rect x="510" y="610" width="420" height="70" rx="8" fill="#f3ece2" stroke="#7a5c2e" stroke-width="2"/>
<text x="522" y="636" font-size="16" font-weight="600" fill="#1b1f23">DeltaV taps DV3_4, DV3_3, DV3_5</text>
<text x="522" y="658" font-size="13.5" fill="#1b1f23">sent to the control system over Modbus, sheet 041</text>
<text x="920" y="672" font-size="11.5" text-anchor="end" fill="#7a5c2e" font-weight="600">FLD 051</text></g>
<path d="M235,148 L255,148" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M470,148 L490,148" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M670,148 L690,148" stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M195,273 L215,273" stroke="#5a6470" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M420,273 L440,273" stroke="#5a6470" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M660,273 L690,273" stroke="#5a6470" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M805,230 L805,197" stroke="#5a6470" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M925,148 L1000,148 L1000,420 L60,420 L60,470" stroke="#333" stroke-width="2.5" fill="none" stroke-dasharray="7,5" marker-end="url(#ah)"/>
<text x="1010" y="300" font-size="13.5" fill="#333">the PLC reads channel 1</text><text x="1010" y="320" font-size="13.5" fill="#333">and names it 03FZA03002</text>
<path d="M230,518 L270,518" stroke="#b8322a" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M470,518 L510,518" stroke="#b8322a" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M670,518 L710,518" stroke="#b8322a" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M910,518 L950,518" stroke="#b8322a" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M125,566 L125,610" stroke="#b8322a" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M370,566 L370,598" stroke="#7a5c2e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M590,566 L590,598" stroke="#7a5c2e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M810,566 L810,598" stroke="#7a5c2e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M370,598 L370,645 L510,645" stroke="#7a5c2e" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<text x="20" y="740" font-size="13.5" fill="#5a6470">Blue: what you can touch with a meter. Grey: where the 24 V comes from. Red: what the PLC program does. Brown: what the operators see. Click a block in the explorer to jump to it on the real drawing.</text>
</svg>